{{ define "main" }}
<section class="portfolio-hero">
  <div class="container">
    <h1>{{ .Title }}</h1>
  </div>
</section>
<section class="section" style="background: var(--c-bg);">
  <div class="container">
    <div class="n-rows">
    {{- range $i, $p := .Pages }}
    <a class="n-row n-row--item" href="{{ $p.RelPermalink }}"><span class="n-row__num">{{ printf "%02d" (add $i 1) }}</span><p>{{ $p.Title }}</p></a>
    {{- end }}
    </div>
  </div>
</section>
{{ end }}
{{ define "scripts" }}
{{- $js := resources.Get "js/site.js" | resources.Fingerprint "sha256" }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
{{ end }}
