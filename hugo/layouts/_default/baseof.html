<!DOCTYPE html>
<html lang="{{ .Site.Language.Params.htmlLang | default .Site.Language.Lang }}" dir="ltr">
<head>
  {{- block "head" . }}{{ partial "head.html" . }}{{ end -}}
</head>
<body class="night">
  {{- partial "header.html" . -}}
  <main>
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
  {{- block "scripts" . }}{{ end -}}
  {{- if not .IsHome }}{{ $st := resources.Get "js/sticky.js" | resources.Fingerprint "sha256" }}
  <script src="{{ $st.RelPermalink }}" integrity="{{ $st.Data.Integrity }}" defer></script>{{ end -}}
</body>
</html>
