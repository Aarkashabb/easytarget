baseURL = "https://easytarget.com.ua/"
locale = "uk-UA"
defaultContentLanguage = "uk"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
pluralizeListTitles = false
summaryLength = 40

[taxonomies]
  tag = "tags"

[outputs]
  home     = ["HTML", "RSS", "LLMS", "LLMSFULL"]
  section  = ["HTML"]
  page     = ["HTML"]
  taxonomy = ["HTML"]
  term     = ["HTML"]

[outputFormats.LLMS]
  mediaType    = "text/plain"
  baseName     = "llms"
  isPlainText  = true
  notAlternative = true

[outputFormats.LLMSFULL]
  mediaType    = "text/plain"
  baseName     = "llms-full"
  isPlainText  = true
  notAlternative = true

[markup.goldmark.renderer]
  unsafe = true

[minify.tdewolff.html]
  keepComments = true

[languages]
  [languages.uk]
    languageName = "Українська"
    languageCode = "uk-UA"
    contentDir   = "content/uk"
    weight       = 1
    [languages.uk.params]
      htmlLang = "uk"
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    contentDir   = "content/en"
    weight       = 2
    [languages.en.params]
      htmlLang = "en"
  [languages.ru]
    languageName = "Русский"
    languageCode = "ru-RU"
    contentDir   = "content/ru"
    weight       = 3
    [languages.ru.params]
      htmlLang = "ru"

[params]
  siteName  = "EasyTarget"
  email     = "blagoveshchenskyivan@gmail.com"
  calendly  = "https://calendly.com/blagoveshchenskyivan/30min"
  telegram  = "https://t.me/Aarkashabb"
  linkedin  = "https://www.linkedin.com/in/aarkashabb"
  twitterCard = "summary_large_image"
